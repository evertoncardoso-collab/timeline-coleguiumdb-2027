async function gerarHash(texto){

    const dados =
        new TextEncoder().encode(texto);

    const hashBuffer =
        await crypto.subtle.digest("SHA-256", dados);

    return Array.from(
        new Uint8Array(hashBuffer)
    )
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

async function carregarEventosDoSupabase() {
    const { data, error } = await supabaseClient
        .from("eventos")
        .select("*")
        .order("data_inicio", { ascending: true });

    if (error) {
        console.error("❌ Erro ao carregar eventos:", error);
        return;
    }

    events = data.map(row => ({
        id: row.id,
        date: row.data_inicio,
        endDate: row.data_fim,
        title: row.titulo,
        category: row.categoria || "",
        segments: row.segmentos || [],
        color: row.cor || "#35b86b",
        description: row.descricao || "",
        type: row.tipo || ""
    }));

    console.log(`✅ ${events.length} eventos carregados DIRETAMENTE do Supabase`);

    render();
}

function formatDate(dateString){
    const date = new Date(dateString + "T12:00:00");
    return date.toLocaleDateString("pt-BR", {
        day:"2-digit",
        month:"short",
        year:"numeric"
    }).replace(".", "");
}

function formatWeekday(dateString){
    const date = new Date(dateString + "T12:00:00");
    return date.toLocaleDateString("pt-BR", {
        weekday:"long"
    });
}


function countPeriodDays(startDate, endDate){
    const [sy, sm, sd] = startDate.split("-").map(Number);
    const [ey, em, ed] = endDate.split("-").map(Number);

    const inicio = Date.UTC(sy, sm - 1, sd);
    const fim = Date.UTC(ey, em - 1, ed);

    return Math.round((fim - inicio) / 86400000) + 1;
}

function renderEventDate(event){

    if(!event.endDate){
        return `
            <div class="event-date">
                ${formatDate(event.date)} • ${formatWeekday(event.date)}
            </div>
        `;
    }

    const totalDias = countPeriodDays(event.date, event.endDate);

    return `
        <div class="period-badge">
            📆 Período • ${totalDias} ${totalDias === 1 ? "dia" : "dias"}
        </div>

        <div class="period-dates">
            ${formatDate(event.date)} → ${formatDate(event.endDate)}
        </div>

        <div class="period-weekdays">
            ${formatWeekday(event.date)} → ${formatWeekday(event.endDate)}
        </div>

        <div class="period-progress">
            <span class="period-point"></span>
            <span class="period-line"></span>
            <span class="period-point"></span>
        </div>
    `;
}
    

function render(){
    const timeline = document.getElementById("timeline");
    const contador = document.getElementById("contador");

    events.sort((a,b) => a.date.localeCompare(b.date));

    contador.textContent = `${events.length} ${events.length === 1 ? "evento" : "eventos"}`;

    if(events.length === 0){
        timeline.innerHTML = `<div class="empty">Nenhum evento cadastrado ainda.<br>Use o formulário abaixo para começar.</div>`;
        timeline.style.display = "block";
        return;
    }

    timeline.style.display = "flex";

    // Agrupa os eventos pela mesma data, para que exista apenas
    // um ponto na linha do tempo para cada dia.
    const groups = [];
    const groupMap = new Map();

    events.forEach((event, index) => {
        if (!groupMap.has(event.date)) {
            const group = { date: event.date, events: [] };
            groupMap.set(event.date, group);
            groups.push(group);
        }
        groupMap.get(event.date).events.push({event, index});
    });

    timeline.innerHTML = groups.map(group => `
        <div class="date-group">
            <div class="event-dot" style="--event-color:${group.events[0].event.color || '#35b86b'}"></div>
            <div class="date-events">
                ${group.events.map(({event, index}) => `
                    <div class="event-card ${event.endDate ? 'period-card' : ''}" style="--event-color:${event.color || '#35b86b'}">
                            ${renderEventDate(event)}
                        <div class="event-title">${escapeHtml(event.title)}</div>
                        <div class="event-desc">
                            <b>${escapeHtml(event.category)}</b> •
                            <b>${escapeHtml((event.segments || (event.segment ? [event.segment] : [])).join(", ") || "—")}</b><br>
                            ${escapeHtml(event.description || "")}
                        </div>
                        
                        ${isAdmin ? `
    <div class="event-actions">
        <button
            class="small-btn edit-btn"
            onclick="editEvent(${index})">
            ✏️ Editar
        </button>

        <button
            class="small-btn delete-btn"
            onclick="removeEvent(${index})">
            🗑 Excluir
        </button>
    </div>
` : ""}
                        </div>
                    </div>
                `).join("")}
            </div>
        </div>
    `).join("");
}

function escapeHtml(text){
    return String(text).replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[char]));
}


function updateDateFields(){
    const type = document.querySelector('input[name="dateType"]:checked').value;
    const singleBox = document.getElementById("singleDateBox");
    const periodBox = document.getElementById("periodDateBox");
    const date = document.getElementById("date");
    const start = document.getElementById("startDate");
    const end = document.getElementById("endDate");

    if(type === "period"){
        singleBox.style.display = "none";
        periodBox.style.display = "block";
        date.required = false;
        start.required = true;
        end.required = true;
    } else {
        singleBox.style.display = "block";
        periodBox.style.display = "none";
        date.required = true;
        start.required = false;
        end.required = false;
    }
}

document.querySelectorAll('input[name="dateType"]').forEach(input => {
    input.addEventListener("change", updateDateFields);
});

function datesBetween(startDate, endDate){
    const result = [];
    let current = new Date(startDate + "T12:00:00");
    const end = new Date(endDate + "T12:00:00");

    while(current <= end){
        const y = current.getFullYear();
        const m = String(current.getMonth()+1).padStart(2,"0");
        const d = String(current.getDate()).padStart(2,"0");
        result.push(`${y}-${m}-${d}`);
        current.setDate(current.getDate()+1);
    }
    return result;
}

document.getElementById("eventForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const selectedColor =
        document.querySelector('input[name="eventColor"]:checked');

    const selectedSegments =
        [...document.querySelectorAll('input[name="segments"]:checked')]
        .map(input => input.value);

    if(selectedSegments.length === 0){
        alert("Selecione pelo menos um Segmento Escolar.");
        return;
    }

    const title =
        document.getElementById("title").value.trim();

    if(!title){
        alert("Informe o nome do evento.");
        return;
    }

    const dateType =
        document.querySelector('input[name="dateType"]:checked').value;

    let startDate;
    let endDate = null;

    if(dateType === "period"){

        startDate =
            document.getElementById("startDate").value;

        endDate =
            document.getElementById("endDate").value;

        if(!startDate || !endDate){
            alert("Informe a data inicial e a data final.");
            return;
        }

        if(endDate < startDate){
            alert("A data final não pode ser anterior à data inicial.");
            return;
        }

    } else {

        startDate =
            document.getElementById("date").value;

        if(!startDate){
            alert("Informe a data do evento.");
            return;
        }
    }

    const eventoBanco = {
        titulo: title,
        data_inicio: startDate,
        data_fim: endDate,
        categoria: document.getElementById("category").value,
        segmentos: selectedSegments,
        cor: selectedColor ? selectedColor.value : "#35b86b",
        descricao: document.getElementById("description").value.trim(),
        tipo: dateType === "period" ? "periodo" : "data_unica"
    };

    if(editingIndex !== null){

        const eventId = events[editingIndex].id;

        const { error } = await supabaseClient
            .from("eventos")
            .update(eventoBanco)
            .eq("id", eventId);

        if(error){
            console.error("Erro ao editar:", error);
            alert("Não foi possível salvar as alterações.");
            return;
        }

        alert("✅ Evento atualizado com sucesso!");

    } else {

        const { error } = await supabaseClient
            .from("eventos")
            .insert([eventoBanco]);

        if(error){
            console.error("Erro ao cadastrar:", error);
            alert("Não foi possível cadastrar o evento.");
            return;
        }

        alert("✅ Evento cadastrado com sucesso!");


        
    }

    await carregarEventosDoSupabase();

    cancelEdit();

    document.getElementById("title").focus();
});

   

let editingIndex = null;

function editEvent(index){
    const event = events[index];
    editingIndex = index;

if(event.endDate){

    document.querySelector(
        'input[name="dateType"][value="period"]'
    ).checked = true;

    document.getElementById("startDate").value = event.date;
    document.getElementById("endDate").value = event.endDate;

} else {

    document.querySelector(
        'input[name="dateType"][value="single"]'
    ).checked = true;

    document.getElementById("date").value = event.date;
}

updateDateFields();

    
    document.getElementById("title").value = event.title;
    document.getElementById("category").value = event.category;
    document.getElementById("description").value = event.description || "";

    // Segmentos: suporta tanto o formato novo quanto eventos antigos.
    const segments = event.segments || (event.segment ? [event.segment] : []);
    document.querySelectorAll('input[name="segments"]').forEach(input => {
        input.checked = segments.includes(input.value);
    });

    document.querySelectorAll('input[name="eventColor"]').forEach(input => {
        input.checked = input.value === (event.color || "#35b86b");
    });

    if (!document.querySelector('input[name="eventColor"]:checked')) {
        document.getElementById("cor-verde").checked = true;
    }

    const submitButton = document.querySelector('#eventForm .primary');
    submitButton.textContent = "💾 Salvar alterações";
    const cancelButton = document.getElementById("cancelEdit");
    if(cancelButton) cancelButton.style.display = "inline-block";

    document.querySelector(".form-box").scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

    document.getElementById("title").focus();
}

function cancelEdit(){
    editingIndex = null;
    document.getElementById("eventForm").reset();
    document.querySelector('input[name="dateType"][value="single"]').checked = true;
    updateDateFields();
    document.getElementById("cor-verde").checked = true;
    document.querySelector('#eventForm .primary').textContent = "➕ Adicionar à Timeline";
    const cancelButton = document.getElementById("cancelEdit");
    if(cancelButton) cancelButton.style.display = "none";
}
async function removeEvent(index){

    const event = events[index];

    if(!event) return;

    if(confirm(`Deseja excluir "${event.title}"?`)){

        const { error } = await supabaseClient
            .from("eventos")
            .delete()
            .eq("id", event.id);

        if(error){
            console.error("Erro ao excluir:", error);
            alert("Não foi possível excluir o evento.");
            return;
        }

        await carregarEventosDoSupabase();

        cancelEdit();

        alert("🗑 Evento excluído com sucesso!");
    }
}    

document.getElementById("clearAll").addEventListener("click", async function(){

    if(!events.length){
        alert("Não há eventos para apagar.");
        return;
    }

    const confirmar = confirm(
        "⚠️ ATENÇÃO!\n\nIsso apagará TODOS os eventos da Timeline e do Supabase.\n\nDeseja realmente continuar?"
    );

    if(!confirmar) return;

    const segundaConfirmacao = confirm(
        "Última confirmação: deseja apagar TODOS os eventos?"
    );

    if(!segundaConfirmacao) return;

    const { error } = await supabaseClient
        .from("eventos")
        .delete()
        .gt("id", 0);

    if(error){
        console.error("Erro ao limpar eventos:", error);
        alert("Não foi possível apagar os eventos.");
        return;
    }

    await carregarEventosDoSupabase();
    cancelEdit();

    alert("Todos os eventos foram apagados.");
});

const slider = document.getElementById("timelineScroll");
let isDown = false, startX, scrollLeft;

slider.addEventListener("mousedown", e=>{
    isDown=true;
    startX=e.pageX-slider.offsetLeft;
    scrollLeft=slider.scrollLeft;
});
slider.addEventListener("mouseleave",()=>isDown=false);
slider.addEventListener("mouseup",()=>isDown=false);
slider.addEventListener("mousemove",e=>{
    if(!isDown)return;
    e.preventDefault();
    const x=e.pageX-slider.offsetLeft;
    const walk=(x-startX)*1.5;
    slider.scrollLeft=scrollLeft-walk;
});

const timelineScroll =
    document.getElementById("timelineScroll");

const timelinePrev =
    document.getElementById("timelinePrev");

const timelineNext =
    document.getElementById("timelineNext");


function moverTimeline(direcao){

    const distancia = Math.max(
        280,
        Math.min(timelineScroll.clientWidth * 0.82, 800)
    );

    timelineScroll.scrollBy({
        left: direcao * distancia,
        behavior: "smooth"
    });
}


timelinePrev.addEventListener("click", ()=>{
    moverTimeline(-1);
});


timelineNext.addEventListener("click", ()=>{
    moverTimeline(1);
});


function atualizarBotoesTimeline(){

    const maxScroll =
        timelineScroll.scrollWidth -
        timelineScroll.clientWidth;

    timelinePrev.disabled =
        timelineScroll.scrollLeft <= 3;

    timelineNext.disabled =
        timelineScroll.scrollLeft >= maxScroll - 3;
}


timelineScroll.addEventListener(
    "scroll",
    atualizarBotoesTimeline,
    {passive:true}
);


window.addEventListener(
    "resize",
    atualizarBotoesTimeline
);


setTimeout(atualizarBotoesTimeline, 500);
